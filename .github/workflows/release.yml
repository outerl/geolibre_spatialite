# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, verify, and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile native SpatiaLite WebAssembly runtime
        run: npm run build:wasm

      - name: Build TypeScript library and plugin bundles
        run: npm run build

      - name: Build installable GeoLibre plugin archive
        run: npm run package:geolibre

      - name: Verify package integrity and checksums
        run: npm run test:package

      - name: Exercise native engine test suite
        run: npm run test:native

      - name: Verify packaged worker in Chromium browser
        run: npm run test:native:browser -- --package

      - name: Package npm library tarball
        run: npm pack --pack-destination geolibre-plugin/dist

      - name: Copy native build metadata to release directory
        run: cp src/wasm/build-info.json geolibre-plugin/dist/NATIVE_BUILD_INFO.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geolibre-spatialite-release-${{ github.ref_name }}
          path: |
            geolibre-plugin/dist/*.zip
            geolibre-plugin/dist/*.zip.sha256.json
            geolibre-plugin/dist/*.tgz
            geolibre-plugin/dist/NATIVE_BUILD_INFO.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            geolibre-plugin/dist/*.zip
            geolibre-plugin/dist/*.zip.sha256.json
            geolibre-plugin/dist/*.tgz
            geolibre-plugin/dist/NATIVE_BUILD_INFO.json
          generate_release_notes: true

      - name: Dispatch central site deployment
        uses: actions/github-script@v7
        env:
          GEO_SITE_DISPATCH_TOKEN: ${{ secrets.GEO_SITE_DISPATCH_TOKEN }}
        with:
          github-token: ${{ secrets.GEO_SITE_DISPATCH_TOKEN || github.token }}
          script: |
            if (!process.env.GEO_SITE_DISPATCH_TOKEN) {
              const message = 'GEO_SITE_DISPATCH_TOKEN is not configured. The release assets were published, but no central site deployment was requested.';
              core.warning(message);
              await core.summary.addHeading('Central site deployment not requested', 2).addRaw(message, true).write();
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'outerl',
              repo: 'geolibre_site',
              event_type: 'plugin-updated',
              client_payload: {
                repository: `${context.repo.owner}/${context.repo.repo}`,
                sha: context.sha,
                ref: context.ref,
              },
            });

            await core.summary
              .addHeading('Central site deployment requested', 2)
              .addRaw(`Dispatched ${context.repo.owner}/${context.repo.repo} at ${context.sha} to outerl/geolibre_site.`, true)
              .write();
