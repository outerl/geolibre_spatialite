name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript and JavaScript
        run: npm run lint

  native:
    name: Build and verify native runtime
    needs: lint
    uses: ./.github/workflows/build-wasm.yml

  test:
    needs: native
    name: Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download tested native runtime and corresponding sources
        uses: actions/download-artifact@v4
        with:
          name: spatialite-native-${{ github.sha }}
          path: src/wasm

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run test suite with coverage
        run: npm test

      - name: Test development server boundaries
        run: npm run test:scripts

      - name: Build library and plugin bundles
        run: npm run build

      - name: Test compiled native engine
        run: npm run test:native

  package:
    name: Package & Verify (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download tested native runtime and corresponding sources
        uses: actions/download-artifact@v4
        with:
          name: spatialite-native-${{ github.sha }}
          path: src/wasm

      - name: Build installable plugin archive
        run: npm run package:geolibre

      - name: Verify package checksum and integrity
        run: npm run test:package

      - name: Verify packaged paged worker in Chromium
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:native:browser -- --package

      - name: Upload plugin archive and checksum artifact
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: geolibre-spatialite-${{ github.sha }}
          path: |
            geolibre-plugin/dist/*.zip
            geolibre-plugin/dist/*.zip.sha256.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            geolibre-plugin/dist/*.zip
            geolibre-plugin/dist/*.zip.sha256.json
          generate_release_notes: true

  notify-site:
    name: Request central site deployment
    needs: package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch plugin update event
        uses: actions/github-script@v7
        env:
          GEO_SITE_DISPATCH_TOKEN: ${{ secrets.GEO_SITE_DISPATCH_TOKEN }}
        with:
          github-token: ${{ secrets.GEO_SITE_DISPATCH_TOKEN || github.token }}
          script: |
            if (!process.env.GEO_SITE_DISPATCH_TOKEN) {
              const message = 'GEO_SITE_DISPATCH_TOKEN is not configured. The plugin archive was built, but no central site deployment was requested.';
              core.warning(message);
              await core.summary.addHeading('Central site deployment not requested', 2).addRaw(message, true).write();
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'outerl',
              repo: 'geolibre_site',
              event_type: 'plugin-updated',
              client_payload: {
                repository: `${context.repo.owner}/${context.repo.repo}`,
                sha: context.sha,
              },
            });

            await core.summary
              .addHeading('Central site deployment requested', 2)
              .addRaw(`Dispatched ${context.repo.owner}/${context.repo.repo} at ${context.sha} to outerl/geolibre_site.`, true)
              .write();
